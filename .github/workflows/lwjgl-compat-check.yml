name: LWJGL compatibility check

# One-off diagnostic: lists the LWJGL API Minecraft uses that the iOS launcher's lwjgl.jar lacks.
# Nothing is uploaded; the report is in the job log.

on:
  push:
    branches: [lwjgl-compat-check]
  workflow_dispatch:
    inputs:
      version:
        description: Minecraft version
        default: '26.1'
      launcher_ref:
        description: Launcher branch to build lwjgl.jar from
        default: glfw34-patch
      lwjgl_jar:
        description: Jar to check, relative to JavaApp (build/lwjgl-3.4.1.jar on branches with per-version LWJGL)
        default: build/lwjgl.jar
      mods:
        description: Fabric mods to check too, as space-separated modrinth-slug:version-substring
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout checker
        uses: actions/checkout@main
        with:
          path: checker

      - name: Checkout launcher
        uses: actions/checkout@main
        with:
          ref: ${{ inputs.launcher_ref || 'glfw34-patch' }}
          path: launcher

      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 8

      - name: Build lwjgl.jar
        run: |
          # com.apple.eawt only exists in the macOS JDK; a stub is enough to compile the launcher classes
          mkdir -p stub/src/com/apple/eawt stub/classes launcher/JavaApp/libs/zz_stub
          echo 'package com.apple.eawt; public class Application { public static Application getApplication() { return null; } }' > stub/src/com/apple/eawt/Application.java
          "$JAVA_HOME/bin/javac" -d stub/classes stub/src/com/apple/eawt/Application.java
          "$JAVA_HOME/bin/jar" cf launcher/JavaApp/libs/zz_stub/eawt.jar -C stub/classes .
          make -C launcher/JavaApp BOOTJDK="$JAVA_HOME/bin" all > build.log 2>&1 || { tail -50 build.log; exit 1; }
          ls -la launcher/JavaApp/build/*.jar
          git -C launcher log -1 --format='Launcher commit %h %s'

      - name: Download mods
        if: ${{ inputs.mods != '' }}
        env:
          MODS: ${{ inputs.mods }}
          MC_VERSION: ${{ inputs.version || '26.1' }}
        run: |
          mkdir -p "$RUNNER_TEMP/mods"
          python3 -I - "$RUNNER_TEMP/mods" <<'PY'
          import hashlib, json, os, sys, urllib.parse, urllib.request
          out = sys.argv[1]
          game = json.dumps([os.environ['MC_VERSION']])
          for spec in os.environ['MODS'].split():
              slug, _, want = spec.partition(':')
              url = 'https://api.modrinth.com/v2/project/%s/version?loaders=%s&game_versions=%s' % (
                  slug, urllib.parse.quote('["fabric"]'), urllib.parse.quote(game))
              req = urllib.request.Request(url, headers={'User-Agent': 'amethyst-ios-fork lwjgl-compat-check'})
              versions = json.load(urllib.request.urlopen(req))
              match = next((v for v in versions if want in v['version_number']), None)
              if match is None:
                  print('mod', slug, 'has no', os.environ['MC_VERSION'], 'Fabric version matching', repr(want))
                  continue
              f = next((f for f in match['files'] if f['primary']), match['files'][0])
              data = urllib.request.urlopen(urllib.request.Request(f['url'], headers=req.headers)).read()
              if hashlib.sha512(data).hexdigest() != f['hashes']['sha512']:
                  sys.exit('SHA-512 mismatch for ' + f['url'])
              open(os.path.join(out, f['filename']), 'wb').write(data)
              print('mod', slug, match['version_number'], f['filename'])
          PY

      - name: Check Minecraft
        run: |
          mod_args=()
          for j in "$RUNNER_TEMP"/mods/*.jar; do if [ -f "$j" ]; then mod_args+=(--jar "$j"); fi; done
          python3 -I checker/lwjgl_compat_check.py --version "${{ inputs.version || '26.1' }}" "${mod_args[@]}" \
            --lwjgl "launcher/JavaApp/${{ inputs.lwjgl_jar || 'build/lwjgl.jar' }}" --jdk "$JAVA_HOME/jre/lib/rt.jar" --cache "$RUNNER_TEMP/mc-cache" --dump
